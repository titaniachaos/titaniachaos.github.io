name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce VitePress-only sources
        run: |
          # Scoped to the Markdown sources: docs/public holds static assets a
          # page may legitimately need, and dist is build output.
          if find docs \
               -path docs/public -prune -o \
               -path docs/.vitepress/dist -prune -o \
               -type f \( -name '*.html' -o -name '*.htm' \) -print | grep -q .; then
            echo 'Legacy HTML files are not allowed; author pages in VitePress Markdown.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build is itself the dead-link checker: VitePress fails on a dead
      # internal link. These add what it does not check -- section ids, locale
      # parity, ledger integrity -- and they gate the deploy, so a change that
      # breaks them is never published.
      - name: Check the sources
        run: npm run check:sources

      - name: Build VitePress
        run: npm run docs:build

      - name: Check the built site
        run: npm run check:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
