name: Maintenance

# The link check needs the network, and so cannot run on a pull request without
# making it flaky. It can also be started by hand.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays: has anything we cite stopped resolving?
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Outward links and citations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - run: npm run check:links
