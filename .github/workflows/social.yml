name: Sync the feeds

# Two different things come out of the same accounts. `social-sync.mjs` keeps
# the wall at the foot of the home page: recent posts, shown as posts.
# `feed-sync.mjs` keeps frames — the same size and encoding as the picture
# archive, tagged from their captions — so a post can be placed in the text of
# a page like any other photograph.
#
# Instagram long-lived tokens last 60 days and are refreshed by using them, so
# this runs often enough to keep the token alive as well as the feeds current.
# Without the secrets every step no-ops and the job passes: a fork must not
# fail on a secret it cannot have. Facebook needs FB_PAGE_ID and FB_TOKEN;
# with neither, that half is simply skipped.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Refresh the long-lived token
        id: refresh
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/social-token.mjs

      - name: Pull the latest posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/social-sync.mjs 4

      - name: Pull frames for the pages
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: node scripts/feed-sync.mjs 6

      - name: Verify the site still builds and stays within budget
        run: npm run check

      - name: Commit only if something changed
        run: |
          paths="docs/public/social docs/.vitepress/social-manifest.json \
                 docs/public/images/media docs/.vitepress/media-manifest.json"
          if [ -z "$(git status --porcelain $paths)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "chore: sync the feeds"
          git push
