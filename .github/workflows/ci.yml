name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce VitePress-only sources
        run: |
          if find . -path './.git' -prune -o -type f \( -name '*.html' -o -name '*.htm' \) -print | grep -q .; then
            echo 'Legacy HTML files are not allowed; author pages in VitePress Markdown.'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
