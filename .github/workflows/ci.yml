name: Build check

# The build is the link checker -- VitePress fails on a dead internal link --
# and the scripts add what it does not check: section ids, locale parity, and
# the integrity of the source ledger. All of it runs before a change reaches
# main, not after.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce VitePress-only sources
        run: |
          # Scoped to the Markdown sources: docs/public holds static assets a
          # page may legitimately need, and dist is build output.
          if find docs \
               -path docs/public -prune -o \
               -path docs/.vitepress/dist -prune -o \
               -type f \( -name '*.html' -o -name '*.htm' \) -print | grep -q .; then
            echo 'Legacy HTML files are not allowed; author pages in VitePress Markdown.'
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Check the sources
        run: npm run check:sources

      - name: Build
        run: npm run docs:build

      - name: Check the built site
        run: npm run check:build
